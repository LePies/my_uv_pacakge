[project]
name = "my-uv-pacakge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LePies", email = "olebmo@dtu.dk" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
my-uv-pacakge = "my_uv_pacakge:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*", "dev"]

[tool.uv.build-backend]
module-root = ""        # package sits at repo root (flat layout), not under src/

[dependency-groups]
dev = [
    {include-group = "docs"},
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
    "sphinx-autoapi>=3.8.1",
]
