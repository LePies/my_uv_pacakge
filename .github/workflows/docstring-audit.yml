name: Docstring audit

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # Copilot CLI requires Node 22+

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run docstring audit
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -s \
            --allow-all-tools \
            -p "Run the docstring-audit skill defined in \
                .github/skills/docstring-audit/SKILL.md. Audit every Python \
                file in my_uv_pacakge/ including subpackages. This runs \
                unattended — do NOT ask for confirmation, directly create the \
                GitHub issues per the skill's output format with the \
                'documentation' label. Before creating, check existing open \
                issues and skip findings that already have an issue (match on \
                the '[docs]:' title prefix)."
